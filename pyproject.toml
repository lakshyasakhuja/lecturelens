[project]
name = "lecturelens"
version = "0.1.0"
description = "Semantic search for lecture recordings: what was said, what was on the slide, and what the slide looked like."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Lakshya Sakhuja" }]
keywords = ["information-retrieval", "multimodal", "lecture-search", "asr", "ocr"]

# Core: everything needed to load an index, fuse rankings and compute metrics.
# No deep-learning framework here, so the unit tests and CI stay small and fast.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "pillow>=10.1",
    "scipy>=1.11",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
# Query and document encoders. Needed online (to embed a query) and offline (to embed moments).
models = [
    "torch>=2.4",
    "transformers>=4.51",
    "sentence-transformers>=3.3",
    "sentencepiece>=0.2",
    "protobuf>=4",
]
# Offline indexing only: speech recognition and OCR.
index = [
    "lecturelens[models]",
    "faster-whisper>=1.1",
    "rapidocr>=3.2",
    "onnxruntime>=1.19",
]
# Evaluation scripts: WER, charts, and the PySceneDetect baseline.
eval = [
    "jiwer>=3",
    "matplotlib>=3.8",
    "scenedetect[opencv-headless]>=0.6.4",
]

[project.scripts]
lecturelens = "lecturelens.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lecturelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "ffmpeg: needs the ffmpeg binary on PATH",
    "models: downloads and runs real models (slow; run with `pytest -m models`)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "RUF001", # the multiplication sign and plus-minus are intentional in docstrings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"lecturelens/cli.py" = ["B008"] # typer.Option(...) in argument defaults is the documented pattern
