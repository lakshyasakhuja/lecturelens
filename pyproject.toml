[project]
name = "slideseek"
version = "0.1.0"
description = "Find the moment a slide was shown in a lecture recording, from a question or a picture of the slide."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Lakshya Sakhuja" }]
keywords = ["information-retrieval", "multimodal", "lecture-search", "asr", "ocr"]

# Core: everything needed to load an index, fuse rankings and compute metrics.
# No deep-learning framework here, so the unit tests and CI stay small and fast.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "pillow>=10.1",
    "scipy>=1.11",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
# Query and document encoders. Needed online (to embed a query) and offline (to embed moments).
models = [
    "torch>=2.4",
    "transformers>=5.0",
    "sentence-transformers>=5.0",
    "sentencepiece>=0.2",
    "protobuf>=4",
]
# Slide OCR: reads slides when indexing, and reads a picture of a slide when searching.
ocr = [
    "rapidocr>=3.2",
    "onnxruntime>=1.19",
]
# Offline indexing only: speech recognition and OCR.
index = [
    "slideseek[models,ocr]",
    "faster-whisper>=1.1",
]
# The web app: a small JSON API plus a static frontend. Serving real queries also needs
# the `models` extra for the query encoders; it is kept separate so the API can be tested
# without a deep-learning framework.
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
# The Hugging Face Space: the web app on Gradio's server, which is what ZeroGPU runs.
# `spaces` does nothing off ZeroGPU, so this also runs, and is tested, anywhere else.
space = [
    "slideseek[web]",
    "gradio>=6.32,<7",
    "spaces>=0.52",
]
# Evaluation scripts: WER, charts, and the PySceneDetect baseline.
eval = [
    "jiwer>=3",
    "matplotlib>=3.8",
    "scenedetect>=0.6.4",
]

[project.scripts]
slideseek = "slideseek.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slideseek"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "ffmpeg: needs the ffmpeg binary on PATH",
    "models: downloads and runs real models (slow; run with `pytest -m models`)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "SIM905", # a whitespace-separated word list is more readable than 125 quoted lines
    "RUF001", # the multiplication sign and plus-minus are intentional in docstrings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# typer.Option(...) in argument defaults is the documented pattern
"slideseek/cli.py" = ["B008"]
"slideseek/web/server.py" = ["B008"] # the same pattern, for FastAPI's Query(...)
"eval/*.py" = ["B008", "E402"] # E402: the scripts put the repo root on sys.path first
